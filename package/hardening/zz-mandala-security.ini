; Interim request hardening after the PHP security release of 2026-10-21 (CVE-2026-109618 and
; CVE-2026-109619). Not a fix: only a patched PHP is. Loaded last (zz-) so it wins over the
; base's own ini files.
; Set here, not with ini_set() or .user.ini, which PHP says do not protect.

; Blocks the upload-progress path that CVE-2026-109619 uses.
session.upload_progress.enabled = 0

; The SP only receives SAML posts (URL-encoded, tens of KB at most). It takes no uploads,
; so PHP never needs to parse a file upload, and 1M leaves wide headroom for large
; assertions. PHP does not read a body larger than post_max_size.
file_uploads = Off
post_max_size = 1M
upload_max_filesize = 1M

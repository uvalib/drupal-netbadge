# Interim request hardening after the PHP security release of 2026-10-21 (CVE-2026-109618 and
# CVE-2026-109619). Not a fix: only a patched PHP is. See package/hardening/zz-mandala-security.ini.

# The SP receives only URL-encoded SAML posts. Refuse multipart/form-data outright, before any
# handler (and so before PHP parses it). This is the control that matters: unlike a body-size
# cap, it stops the request whatever its size.
<If "%{REQUEST_METHOD} == 'POST' && %{req:Content-Type} =~ m#^multipart/#i">
    Require all denied
</If>

# Coarse cap on bodies Apache reads. It adds little beyond PHP's own post_max_size (PHP does not
# read a body over that), so it is a backstop, not the protection.
LimitRequestBody 1048576

# The same upload-progress switch as the ini file, set where applications cannot override it.
# Guarded so the config still loads if the image ever moves off mod_php.
<IfModule mod_php.c>
    php_admin_flag session.upload_progress.enabled off
</IfModule>
